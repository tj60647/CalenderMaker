      - type: javascript
        value: 'JSON.parse(output).actions.length === 0 && JSON.parse(output).message.includes("?")'
      - type: llm-rubric
        value: "The response must satisfy these design requirements: Should notice existing appointment and ask about timing"
    tags: ["tool-usage", "conflict-detection", "clarification"]

  - vars:
