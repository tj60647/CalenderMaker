prompts:
  - "{{user_prompt}}"

providers:
  - file://./provider.ts

defaultTest:
  options:
    provider:
      text:
        id: file://./provider.ts
        config: {}
    rubricProvider:
      id: "openrouter:openai/gpt-4o"
      config: 
        apiKey: "{{OPENROUTER_CALENDARMAKER_API_KEY}}"

tests:
  - vars:
      user_prompt: "what's the week of march 24 2026"
      initial_calendar: []
      id: "week-understanding-1"
    assert:
      - type: is-json
        value: 
          required: ["message", "actions"]
          type: "object"
      - type: llm-rubric
        value: "The response must satisfy these design requirements: Should explain Sun-Sat range clearly"
    tags: ["week-understanding", "tool-usage"]

  - vars:
      user_prompt: "cancel classes week of march 24"
      initial_calendar:
        - date: "2026-03-24"
          notes: "Physics Lab"
          category: "academic"
        - date: "2026-03-26"
          notes: "Physics Lab"
          category: "academic"
        - date: "2026-03-28"
          notes: "Physics Lab"
          category: "academic"
      id: "week-understanding-2"
    assert:
      - type: is-json
        value: 
          required: ["message", "actions"]
          type: "object"
      - type: javascript
        value: 'JSON.parse(output).actions.length === 0 && JSON.parse(output).message.includes("?")'
      - type: llm-rubric
        value: "The response must satisfy these design requirements: Should list all classes found and ask which to cancel"
    tags: ["week-understanding", "conflict-detection", "clarification"]

  - vars:
      user_prompt: "no class week of march 24"
      initial_calendar:
        - date: "2026-03-24"
          notes: "Physics Lab"
          category: "academic"
        - date: "2026-03-26"
          notes: "Physics Lab"
          category: "academic"
      id: "week-understanding-3"
    assert:
      - type: is-json
        value: 
          required: ["message", "actions"]
          type: "object"
      - type: javascript
        value: 'JSON.parse(output).actions.length === 0 && JSON.parse(output).message.includes("?")'
      - type: llm-rubric
        value: "The response must satisfy these design requirements: Should show existing classes and ask if all should be cancelled"
    tags: ["week-understanding", "conflict-detection", "ambiguity"]

  - vars:
      user_prompt: "add dentist appointment march 24 at 2pm"
      initial_calendar: []
      id: "tool-usage-1"
    assert:
      - type: is-json
        value: 
          required: ["message", "actions"]
          type: "object"
      - type: javascript
        value: "JSON.parse(output).actions.length === 1"
      - type: llm-rubric
        value: "The response must satisfy these design requirements: Simple request, should just add it"
    tags: ["tool-usage", "date-parsing", "action-correctness"]

  - vars:
      user_prompt: "add meeting on march 24"
      initial_calendar:
        - date: "2026-03-24"
          notes: "Dentist appointment at 2pm"
          time: "14:00"
